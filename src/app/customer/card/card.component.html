<div class="card h-100" style="cursor: pointer" (click)="viewDetailsEvent()">
<img class="card-img-top" [src]="" [alt]="product.title" style="height: 200px; object-fit: cover;">
    
<div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ product.title }}</h5>
    <p class="card-text flex-grow-1">{{ product.description }}</p>
    
    <div class="mt-auto">
    <p class="card-text"><strong>${{ product.price }}</strong></p>
    <button class="btn btn-primary btn-block" (click)="$event.stopPropagation(); addToCart(product)">
        Add to Cart
    </button>
    </div>
</div>
</div>
